<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NERDSHOP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="headercima">
    <div class="logo"><a href="{{ url_for('index') }}">NERDSHOP</a></div>

    <div class="extras">
        <a href="{{ url_for('pc') }}" class="espcs">PC</a>
        <a href="perifericos.html" class="espcs">Periféricos</a>
        <a href="console.html" class="espcs">Console</a>
        <a href="suporte.html" class="espcs">Suporte</a>
        <a href="{{ url_for('cadastro') }}" class="espcs">Cadastrar Produtos</a>
    </div>

    <div class="barrapesquisa">
        <input type="text" placeholder="BUSCAR">
        <button class="pesquisa">OK</button>
    </div>

    <div class="acoes-header">
        <img src="{{ url_for('static', filename='src/1.png') }}" alt="carrinho" class="iconheader">

        <div class="menu-container">
            <img src="{{ url_for('static', filename='src/2.png') }}" alt="menu" class="iconheader" onclick="toggleMenu()">
            <div class="menudropdown" id="menudropdown">
                <a href="{{ url_for('login_usuario') }}" class="botaomenu">Login</a> 
                <a href="{{ url_for('cadastro_usuario') }}" class="botaomenu">Cadastro</a>
            </div>
        </div>
    </div>
</header>

<script>
function toggleMenu() {
    const menu = document.getElementById('menudropdown');
    menu.classList.toggle('show');
}
</script>

<section>
    <h2 class="produtos-title">Produtos em Destaque</h2>
    <div class="produtos-container">
        {% for produto in produtos %}
        <div class="produto-card">
            <a href="{{ url_for('produto_detalhe', produto_id=loop.index0) }}">
                {% if produto[5] %}
                    <img src="{{ produto[5] }}" alt="{{ produto[0] }}">
                {% else %}
                    <img src="{{ url_for('static', filename='src/default.png') }}" alt="{{ produto[0] }}">
                {% endif %}
                <h3>{{ produto[0] }}</h3>
                <p>{{ produto[1] }}</p>
                <p><strong>R$ {{ produto[2] }}</strong></p>
            </a>
        </div>
        {% endfor %}
    </div>
</section>

<footer class="footer">
    <p>© 2025 NERDSHOP - Todos os direitos reservados</p>
</footer>

</body>
</html>
