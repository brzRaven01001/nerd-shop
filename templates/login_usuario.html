<!DOCTYPE html>
<html lang="pt-br" >
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Poppins&amp;display=swap'>
<link rel="stylesheet" href="../static/login_usuario.css">
</head>
<body>

<div class="wrapper">
  <div class="login_box">
    <div class="login-header">
      <span>Login</span>
    </div>

    <div class="input_box">
      <input type="text" id="user" class="input-field" required>
      <label for="user" class="label">Usuário</label>
      <i class="bx bx-user icon"></i>
    </div>

    <div class="input_box">
      <input type="password" id="pass" class="input-field" required>
      <label for="pass" class="label">Senha</label>
      <i class="bx bx-lock-alt icon"></i>
    </div>

    <div class="remember-forgot">
      <div class="remember-me">
        <input type="checkbox" id="remember">
        <label for="remember">Lembre de mim</label>
      </div>

      <div class="forgot">
        <a href="#">Esqueceu a senha?</a>
      </div>
    </div>

    <div class="input_box">
      <input type="submit" class="input-submit" value="Login" onclick="loginUsuario()"/>
    </div>

    <div class="register">
      <span>Não possui conta? <a href="{{ url_for('cadastro_usuario') }}">Registre-se agora!</a></span>
    </div>
  </div>
</div>

  
</body>
</html>
